[package]
name = "uplc_tx"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[dependencies]
# Unreleased aiken: main after v1.1.24 (per-transaction script context and
# shared Data) plus aiken-lang/aiken#1456 (ScriptCache). Switch back to a
# crates.io version once one is published.
uplc = { git = "https://github.com/colll78/aiken.git", rev = "6868a8d9d240060a83600de66ab236175ecb6139" }
wasm-bindgen = "0.2.93"
js-sys = "0.3.70"

# required for wasm usage of getrandom
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3']

# Size-optimized variant, built with `wasm-pack build --profile release-size`.
[profile.release-size]
inherits = "release"
opt-level = "z"

[package.metadata.wasm-pack.profile.custom]
wasm-opt = ['-Oz']
