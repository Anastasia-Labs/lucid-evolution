[package]
name = "uplc_tx"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[dependencies]
uplc = "=1.1.24"
# Same pallas release as the one `uplc` builds against.
pallas-addresses = "0.35.1"
pallas-codec = "0.35.1"
pallas-crypto = "0.35.1"
pallas-primitives = "0.35.1"
pallas-traverse = "0.35.1"
wasm-bindgen = "0.2.93"
js-sys = "0.3.70"

# required for wasm usage of getrandom
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3']

# Size-optimized variant, built with `wasm-pack build --profile release-size`.
[profile.release-size]
inherits = "release"
opt-level = "z"

[package.metadata.wasm-pack.profile.custom]
wasm-opt = ['-Oz']
